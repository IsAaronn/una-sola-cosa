<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Te</title>
    <style>
        /* Centra tutto nella pagina e usa uno sfondo neutro */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* La "busta" minimalista */
        .busta {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Il titolo richiesto */
        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Il bottone per aprire la lettera */
        .bottone-apri {
            display: inline-block;
            padding: 12px 24px;
            background-color: #ff4d4d; /* Un rosso deciso, visto il tema */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        /* Effetto quando si passa il mouse sopra il bottone */
        .bottone-apri:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>

    <div class="busta">
        <h1>la cosa che odio di te</h1>
        
        <a href="https://docs.google.com/document/d/1V2ATtIC-F-pU4GlNWouzS350WvABLHiqOVAXD0LaSQ0/edit?tab=t.0 target="_blank" class="bottone-apri">
            Apri la lettera
        </a>
    </div>

</body>
</html>
